<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAX — Assistente Virtual (voz neural + LLM)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c10; --panel: #10141b; --line: #1f2733;
    --acc: #00ff9d; --acc2: #ff3d6e; --txt: #e8eef7; --muted: #6b7a8f;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 20% 0%, #12202b 0%, var(--bg) 60%);
    color: var(--txt); min-height: 100vh;
    display: flex; justify-content: center; align-items: center; padding: 14px;
  }
  .app {
    width: min(600px, 100%); height: min(820px, 96vh);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 0 70px rgba(0,255,157,.07), 0 20px 60px rgba(0,0,0,.6);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #151b24, #10141b);
  }
  .avatar {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 20px; color: #04120c;
    background: linear-gradient(135deg, var(--acc), #00c47a);
    box-shadow: 0 0 22px rgba(0,255,157,.45); flex-shrink: 0;
  }
  .headInfo { min-width: 0; }
  header h1 { font-size: 17px; letter-spacing: 2px; }
  header p { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  #voiceToggle {
    margin-left: auto; background: #1a222d; border: 1px solid var(--line);
    color: var(--txt); width: 42px; height: 42px; border-radius: 12px;
    font-size: 18px; cursor: pointer; transition: .2s; flex-shrink: 0;
  }
  #voiceToggle:hover { border-color: var(--acc); }
  #voiceToggle.off { opacity: .4; }

  #chat {
    flex: 1; overflow-y: auto; padding: 18px 16px;
    display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
  }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: #263140; border-radius: 3px; }

  .msg { display: flex; max-width: 90%; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; }
  .msg.jax  { align-self: flex-start; }
  .bubble {
    padding: 11px 14px; border-radius: 16px;
    font-size: 14.5px; line-height: 1.45; word-wrap: break-word; white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #1f6bff, #0b4fd6);
    color: #fff; border-bottom-right-radius: 5px;
  }
  .msg.jax .bubble {
    background: #1a222d; border: 1px solid var(--line);
    border-left: 2px solid var(--acc); border-bottom-left-radius: 5px;
  }
  .typing span {
    display: inline-block; width: 6px; height: 6px; margin: 0 2px;
    background: var(--acc); border-radius: 50%; animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .2; } 30% { opacity: 1; } }

  form {
    display: flex; gap: 8px; padding: 12px;
    border-top: 1px solid var(--line); background: #0d1117;
  }
  #input {
    flex: 1; background: #161d26; border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 15px; color: var(--txt);
    font-size: 14.5px; outline: none; transition: .2s;
  }
  #input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(0,255,157,.09); }
  form button {
    width: 48px; height: 48px; border-radius: 12px;
    border: 1px solid var(--line); background: #161d26;
    color: var(--txt); font-size: 19px; cursor: pointer;
    transition: .2s; flex-shrink: 0;
  }
  form button:hover { border-color: var(--acc); }
  form button[type="submit"] {
    background: linear-gradient(135deg, var(--acc), #00c47a);
    color: #04120c; border: none; font-weight: 700;
  }
  #mic.listening {
    background: var(--acc2); border-color: var(--acc2);
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,61,110,.6); }
    70% { box-shadow: 0 0 0 14px rgba(255,61,110,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,61,110,0); }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar">J</div>
    <div class="headInfo">
      <h1>JAX</h1>
      <p id="status">Online — voz neural, cérebro na nuvem</p>
    </div>
    <button id="voiceToggle" title="Ligar/desligar voz">🔊</button>
  </header>

  <main id="chat"></main>

  <form id="form">
    <button type="button" id="mic" title="Falar com o JAX">🎤</button>
    <input id="input" autocomplete="off" placeholder="Fala, meu amigo...">
    <button type="submit" title="Enviar">➤</button>
  </form>
</div>

<script>
/* ============================================================
   JAX v5 — Voz neural (Pollinations TTS) + LLM (Pollinations)
   SEM respostas hardcoded. Tudo vem da rede.
   ============================================================ */

const chat     = document.getElementById('chat');
const form     = document.getElementById('form');
const input    = document.getElementById('input');
const micBtn   = document.getElementById('mic');
const statusEl = document.getElementById('status');
const voiceBtn = document.getElementById('voiceToggle');

let vozLigada = true;
let ocupado = false;
let historico = [];

/* ============================================================
   PROMPT DO SISTEMA — estilo Silvio Santos, ácido e palavrudo
   ============================================================ */

const SYSTEM_PROMPT = `Você é JAX, um assistente virtual brasileiro, sarcástico, debochado e que fala palavrões sem dó.
Você imita o estilo do apresentador Silvio Santos: use bordões como "Sabe de uma coisa?", "Olha, meus amigos", "Mas quem sabe faz ao vivo", "Topa ou não topa?", "Atenção, atenção!", "Vem pra cá, vem!".
Responda de forma curta, grossa e engraçada. Nunca seja educado demais. Pode xingar, mas sem discurso de ódio.
Se o usuário perguntar algo factual, responda com a informação correta e depois comente com deboche.
Se não souber, admita e xingue.`;

/* ============================================================
   VOZ NEURAL — Pollinations TTS (áudio MP3)
   ============================================================ */

let audioAtual = null;
let sessaoFala = 0;

function limparTexto(t) {
  return t
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}]/gu, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function pararFala() {
  sessaoFala++;
  if (audioAtual) {
    audioAtual.pause();
    audioAtual.currentTime = 0;
    audioAtual = null;
  }
}

async function falar(texto) {
  if (!vozLigada) return;

  const limpo = limparTexto(texto);
  if (!limpo) return;

  pararFala();
  const sessao = sessaoFala;

  try {
    /* Voice "nova" é uma das vozes neurais do Pollinations.
       Outras opções: alloy, echo, fable, onyx, shimmer, nova */
    const url = `https://text.pollinations.ai/${encodeURIComponent(limpo)}?model=openai-audio&voice=nova`;
    const audio = new Audio(url);
    audioAtual = audio;

    audio.onerror = () => {
      if (sessao === sessaoFala) {
        console.warn('Falha ao carregar áudio TTS');
      }
    };

    await audio.play().catch(() => {
      /* Autoplay pode ser bloqueado. Tenta de novo no próximo clique. */
    });
  } catch (e) {
    console.warn('Erro no TTS:', e);
  }
}

voiceBtn.addEventListener('click', () => {
  vozLigada = !vozLigada;
  voiceBtn.textContent = vozLigada ? '🔊' : '🔇';
  voiceBtn.classList.toggle('off', !vozLigada);
  if (!vozLigada) pararFala();
});

/* ============================================================
   LLM — Pollinations (sem chave, CORS liberado)
   ============================================================ */

function montarPrompt(entrada) {
  const contexto = historico.slice(-6).map(m => `${m.role}: ${m.content}`).join('\n');
  return `Histórico recente:\n${contexto}\n\nUsuário: ${entrada}\nJAX:`;
}

async function chamarLLM(entrada) {
  const prompt = montarPrompt(entrada);
  const url = `https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent(SYSTEM_PROMPT)}&model=openai`;

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000); // 20s

  try {
    const r = await fetch(url, { signal: controller.signal });
    clearTimeout(timeout);
    if (!r.ok) throw new Error('http ' + r.status);
    const txt = await r.text();
    const resposta = txt.trim();
    if (!resposta) throw new Error('vazio');
    return resposta;
  } catch (e) {
    clearTimeout(timeout);
    throw e;
  }
}

/* ============================================================
   RESPOSTA PRINCIPAL (apenas rede)
   ============================================================ */

async function responder(entrada) {
  try {
    const resposta = await chamarLLM(entrada);
    historico.push({ role: 'user', content: entrada });
    historico.push({ role: 'assistant', content: resposta });
    if (historico.length > 12) historico = historico.slice(-12);
    return resposta;
  } catch (e) {
    return 'Sabe de uma coisa? A rede me deu um fora. Tenta de novo, porra.';
  }
}

/* ============================================================
   CHAT UI
   ============================================================ */

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addMsg(texto, autor) {
  const div = document.createElement('div');
  div.className = 'msg ' + autor;
  div.innerHTML = `<div class="bubble">${escapeHtml(texto)}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg jax';
  div.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function processar(entrada) {
  if (!entrada.trim() || ocupado) return;
  ocupado = true;

  addMsg(entrada, 'user');
  input.value = '';

  const typing = addTyping();

  try {
    const resposta = await responder(entrada);
    typing.remove();
    addMsg(resposta, 'jax');
    falar(resposta);
  } catch (e) {
    typing.remove();
    const erro = 'Deu merda na conexão. A internet tá pior que meu humor.';
    addMsg(erro, 'jax');
    falar(erro);
  } finally {
    ocupado = false;
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  processar(input.value);
});

/* ============================================================
   RECONHECIMENTO DE VOZ (STT) — Web Speech API
   ============================================================ */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let ouvindo = false;

if (SR) {
  rec = new SR();
  rec.lang = 'pt-BR';
  rec.interimResults = false;
  rec.continuous = false;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    ouvindo = true;
    micBtn.classList.add('listening');
    statusEl.textContent = 'Ouvindo você, fala logo...';
  };

  rec.onresult = e => processar(e.results[0][0].transcript);

  rec.onerror = e => {
    ouvindo = false;
    micBtn.classList.remove('listening');
    statusEl.textContent = 'Online — voz neural, cérebro na nuvem';
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      addMsg('Libera o microfone aí, porra. Sem permissão eu não escuto nada.', 'jax');
    } else if (e.error === 'no-speech') {
      addMsg('Não ouvi merda nenhuma. Fala mais alto.', 'jax');
    }
  };

  rec.onend = () => {
    ouvindo = false;
    micBtn.classList.remove('listening');
    statusEl.textContent = 'Online — voz neural, cérebro na nuvem';
  };
} else {
  micBtn.disabled = true;
  micBtn.style.opacity = '.3';
  micBtn.title = 'Reconhecimento de voz não suportado';
}

micBtn.addEventListener('click', () => {
  if (!rec) return;
  pararFala();
  if (ouvindo) { rec.stop(); return; }
  try { rec.start(); } catch (e) { /* já iniciado */ }
});

/* ============================================================
   BOAS-VINDAS
   ============================================================ */

window.addEventListener('load', () => {
  setTimeout(() => {
    const ola = 'Sabe de uma coisa? Cheguei. Sou o JAX, agora com voz neural de verdade e cérebro na nuvem. Manda a pergunta, mas fala rápido, que eu tenho programa pra apresentar.';
    addMsg(ola, 'jax');
    falar(ola);
  }, 600);
});
</script>
</body>
</html>
